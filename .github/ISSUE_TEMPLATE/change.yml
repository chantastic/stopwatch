name: Request a change
description: Propose a badge experience, website change, or development improvement.
title: "[Change] "
body:
  - type: dropdown
    id: area
    attributes:
      label: What should change?
      options:
        - Badge experience
        - Phone customization
        - Browser installer
        - Website or instructions
        - Build, test, or release process
        - Multiple areas
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what someone should be able to do and why it matters.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: Example experience
      placeholder: When an attendee…, they should see or be able to…
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How will we know it works?
      description: List the observable results needed to consider this complete.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or dependencies
      description: Mention art, event deadlines, phone/USB needs, battery impact, data changes, or related issues if relevant.

